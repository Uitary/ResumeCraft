<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body.preview-page { min-height:100vh; margin:0; padding:0; background:#e9edf1; }
    .preview-window-bar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 24px; background:#182230; color:#f4f6f5; }
    .preview-window-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .preview-window-bar strong { font:600 14px/1.2 Inter, Arial, sans-serif; }
    .preview-window-bar button { border:1px solid rgba(255,255,255,.22); border-radius:7px; padding:9px 14px; background:transparent; color:#fff; font:600 13px/1 Inter, Arial, sans-serif; cursor:pointer; }
    .preview-window-bar button.primary { background:#3a6355; border-color:#3a6355; }
    .preview-page .paper-wrap { padding:34px 0 60px; }
    .preview-empty { max-width:520px; margin:80px auto; padding:30px; background:#fff; text-align:center; color:#475569; font:16px/1.5 Inter, Arial, sans-serif; }
    @media print {
      .preview-window-bar { display:none; }
      body.preview-page { background:#fff; }
      .preview-page .paper-wrap { padding:0; }
    }
  </style>
</head>
<body class="preview-page">
  <header class="preview-window-bar">
    <strong>Resume Preview</strong>
    <div class="preview-window-actions">
      <button type="button" id="downloadPdf">Download PDF</button>
      <button type="button" id="downloadJpg">Download JPG</button>
      <button type="button" id="printPreview" class="primary">Print Resume</button>
    </div>
  </header>
  <main id="previewContent"></main>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script>
    const content = document.getElementById("previewContent");
    const markup = localStorage.getItem("resumePreviewMarkup");
    if (markup) {
      const paperWrap = document.createElement("div");
      paperWrap.className = "paper-wrap";
      paperWrap.innerHTML = markup;
      content.replaceChildren(paperWrap);
    } else {
      content.innerHTML = '<div class="preview-empty">Open this page from the ResumeCraft editor using Preview Page.</div>';
    }
    async function resumeCanvas() {
      if (!window.html2canvas) throw new Error("PDF/JPG export library has not loaded.");
      return html2canvas(document.getElementById("resumePaper"), {scale:2, useCORS:true, backgroundColor:"#ffffff"});
    }
    function previewFileBaseName() {
      return localStorage.getItem("resumePreviewFileBaseName") || "YOUR_NAME_Resume";
    }
    document.getElementById("downloadJpg").addEventListener("click", async () => {
      try {
        const canvas = await resumeCanvas();
        const link = document.createElement("a");
        link.download = previewFileBaseName() + ".jpg";
        link.href = canvas.toDataURL("image/jpeg", .95);
        link.click();
      } catch (error) { alert(error.message); }
    });
    document.getElementById("downloadPdf").addEventListener("click", async () => {
      try {
        const canvas = await resumeCanvas();
        const {jsPDF} = window.jspdf;
        const pdf = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
        pdf.addImage(canvas.toDataURL("image/jpeg", .95), "JPEG", 0, 0, 210, 297);
        pdf.save(previewFileBaseName() + ".pdf");
      } catch (error) { alert(error.message); }
    });
    document.getElementById("printPreview").addEventListener("click", () => window.print());
  </script>
</body>
</html>
